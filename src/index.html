<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>perfecTors | הזמנת מלון</title>
 
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="brand"><img src="perfectors-logo.png" width="1774" height="887" alt="perfecTors"></h1>
    </header>
    <main class="hotel-home">
        <img src="hotel-garden.png" width="1774" height="887" alt="איור של מלון לבן מוקף עצים ירוקים, מרפסות פורחות וגינה צבעונית" fetchpriority="high">
        <div class="home-actions" dir="ltr" lang="en">
            <button type="button" data-dialog="booking" aria-haspopup="dialog">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg>
                <span>New Reservation</span>
            </button>
            <button type="button" data-dialog="lookup" aria-haspopup="dialog">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                <span>Lookup Reservation</span>
            </button>
        </div>
    </main>

    <dialog id="booking" aria-labelledby="booking-title">
        <div class="dialog-heading">
            <h2 id="booking-title">יצירת הזמנה חדשה</h2>
            <button type="button" class="close-dialog" aria-label="סגירת חלונית" title="סגירה">&#215;</button>
        </div>

            <form id="reservationForm">
                <label for="fullName">שם מלא</label>
                <input type="text" id="fullName" placeholder="שם מלא" autocomplete="name" required>
                <label for="email">כתובת אימייל</label>
                <input type="email" id="email" placeholder="כתובת אימייל" autocomplete="email" required>

                <label for="checkIn">תאריך כניסה</label>
                <input type="date" id="checkIn" required>

                <label for="checkOut">תאריך יציאה</label>
                <input type="date" id="checkOut" required>

                <label for="hotelSelect">בחר מלון</label>

                <select id="hotelSelect" required>
                    <option value="">טוען מלונות...</option>
                </select>

                <div id="hotelDetails"></div>

                <button type="submit">בצע הזמנה</button>
            </form>

            <div id="reservationResult" aria-live="polite"></div>
    </dialog>

    <dialog id="lookup" aria-labelledby="lookup-title">
        <div class="dialog-heading">
            <h2 id="lookup-title">חיפוש הזמנה קיימת</h2>
            <button type="button" class="close-dialog" aria-label="סגירת חלונית" title="סגירה">&#215;</button>
        </div>
        <form id="lookupForm">
            <label for="lookupQuery">מספר הזמנה, שם מלא או אימייל</label>
            <input type="text" id="lookupQuery" name="lookupQuery" autocomplete="off" required>
            <button type="submit">חיפוש הזמנה</button>
        </form>
        <div id="lookupResult" aria-live="polite"></div>
    </dialog>

    <script src="script.js"></script>
    <script src="lookup-script.js"></script>
    <script src="dialogs.js"></script>
</body>
</html>
