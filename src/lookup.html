<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>perfecTors | חיפוש הזמנה</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="index.html#booking" aria-label="perfecTors - הזמנת מלון"><img src="perfectors-logo.png" width="1774" height="887" alt="perfecTors"></a>
        <nav class="top-nav" aria-label="ניווט ראשי">
            <a href="index.html#booking">הזמנה חדשה</a>
            <a href="lookup.html" aria-current="page">חיפוש וביטול הזמנה</a>
        </nav>
    </header>
    <div class="hotel-banner">
        <img src="hotel-garden.png" width="1774" height="887" alt="איור של מלון לבן מוקף עצים ירוקים, מרפסות פורחות וגינה צבעונית" fetchpriority="high">
    </div>

    <main class="page-container">
        <section class="card">
            <h1>חיפוש הזמנה קיימת</h1>

            <p class="page-description">
              הזן מספר הזמנה, שם מלא או כתובת אימייל כדי למצוא את פרטי ההזמנה.
            </p>

            <form id="lookupForm">
                <label for="lookupQuery">מספר הזמנה, שם מלא או אימייל</label>

                <input
                    type="text"
                    id="lookupQuery"
                    name="lookupQuery"
                    placeholder="לדוגמה: RES-123456, ישראל ישראלי או email@example.com"
                    autocomplete="off"
                    required
                >

                <button type="submit">חיפוש הזמנה</button>
            </form>

            <div id="lookupResult" aria-live="polite"></div>
        </section>
    </main>

    <script src="lookup-script.js"></script>
</body>
</html>
