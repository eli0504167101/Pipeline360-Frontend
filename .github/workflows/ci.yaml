name: Frontend CI

on:
  push:
    branches:
      - dev
    paths-ignore:
      - README.md
      - docs/**
      - LICENSE
      
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Validate frontend JavaScript
        run: npm test

      - name: Validate required files
        run: |
          set -euo pipefail

          required_files=(
            "Dockerfile"
            ".dockerignore"
            "nginx.conf"
            "package.json"
            "src/index.html"
            "src/lookup.html"
            "src/script.js"
            "src/lookup-script.js"
            "src/style.css"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Required frontend file is missing: $file"
              exit 1
            fi

            echo "Found: $file"
          done

  build-and-push:
    name: Build and push frontend image
    needs:
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Generate frontend image tag
        id: image
        run: |
          set -euo pipefail

          IMAGE_TAG="frontend-${GITHUB_RUN_NUMBER}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Frontend image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hotel-frontend:${{ steps.image.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hotel-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
