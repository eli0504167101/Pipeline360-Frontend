name: Frontend CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Validate frontend JavaScript
        run: npm test

      - name: Validate required files
        run: |
          set -euo pipefail

          required_files=(
            "Dockerfile"
            ".dockerignore"
            "nginx.conf"
            "package.json"
            "src/index.html"
            "src/lookup.html"
            "src/script.js"
            "src/lookup-script.js"
            "src/style.css"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Required frontend file is missing: $file"
              exit 1
            fi

            echo "Found: $file"
          done

  docker-build:
    name: Validate frontend Docker build
    needs:
      - validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image without pushing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pipeline360-frontend:ci-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max